apiVersion: batch/v1
kind: Job
metadata:
  name: training-job
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        job: training
    spec:
      restartPolicy: Never
      containers:
        - name: trainer
          # Replace this with your training image (built from docker/Dockerfile.train)
          image: mlops-train:latest
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "2"
              memory: "4Gi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: configs
              mountPath: /app/configs
            - name: data
              mountPath: /app/data
            - name: checkpoints
              mountPath: /app/checkpoints
      nodeSelector:
        # Adjust this label to match your GPU node labels in the cluster
        nvidia.com/gpu.present: "true"
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      volumes:
        - name: configs
          configMap:
            # Ensure a ConfigMap named `training-config` exists (see k8s/configmap.yaml)
            name: training-config
        - name: data
          persistentVolumeClaim:
            claimName: data-pvc
        - name: checkpoints
          persistentVolumeClaim:
            claimName: checkpoints-pvc